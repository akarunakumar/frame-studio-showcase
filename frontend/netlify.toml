[build]
  base = "frontend"
  command = "npm run build:prod"
  publish = "dist/frame-studio-showcase/browser"

[build.environment]
  NODE_VERSION = "20"

# SPA redirect so refreshing any Angular route (e.g. /projects/modern-3bhk)
# never returns a 404 — see spec section 58.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
